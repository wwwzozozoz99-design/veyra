<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image → Canva Frame</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;background:#f5f5f7;color:#161616}
.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:24px;box-shadow:0 8px 30px #0000000b}
h1{margin:0 0 8px;font-size:30px}p{color:#666}.drop{margin-top:20px;border:2px dashed #aaa;border-radius:16px;padding:45px;text-align:center;cursor:pointer}
input{display:none}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.control{background:#f3f3f3;border-radius:12px;padding:10px 14px}
button{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:#111;color:white}
button.secondary{background:#e9e9e9;color:#111}.preview{margin-top:20px;display:flex;justify-content:center;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0/24px 24px;border-radius:14px;min-height:240px;padding:20px}
canvas{max-width:100%;max-height:420px}.status{margin-top:12px;color:#666;font-size:14px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>Image → Canva Frame</h1>
<p>أداة مجانية تعمل داخل المتصفح. ارفع PNG/JPG/WebP، استخرج الشكل، ونزّل SVG نظيف لتستخدمه مع AutoFramer.</p>
<label class="drop" for="file">اضغط هنا لاختيار صورة<br><small>PNG / JPG / WebP</small></label>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp">
<div class="row">
<label class="control">Threshold <input id="thr" type="range" min="1" max="254" value="245" style="display:inline"></label>
<label class="control">Tolerance <input id="tol" type="range" min="0" max="20" value="4" style="display:inline"></label>
<button id="convert" disabled>تحويل إلى SVG</button>
<button id="download" class="secondary" disabled>تنزيل SVG</button>
</div>
<div class="status" id="status">ماكو ملف مختار.</div>
<div class="preview"><canvas id="canvas"></canvas></div>
</div></div>
<script>
const file=document.getElementById('file'), convert=document.getElementById('convert'), download=document.getElementById('download');
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
const status=document.getElementById('status'), thr=document.getElementById('thr'), tol=document.getElementById('tol');
let img=null, svgText='', filename='frame.svg';

file.onchange=()=>{const f=file.files[0]; if(!f)return; filename=f.name.replace(/\.[^.]+$/,'')+'-frame.svg';
const u=URL.createObjectURL(f); img=new Image(); img.onload=()=>{const s=Math.min(1600/Math.max(img.width,img.height),1);canvas.width=Math.round(img.width*s);canvas.height=Math.round(img.height*s);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);convert.disabled=false;status.textContent=`تم تحميل ${f.name} — ${canvas.width}×${canvas.height}`;URL.revokeObjectURL(u)};img.src=u};

convert.onclick=()=>{
 if(!img)return;
 const w=canvas.width,h=canvas.height, d=ctx.getImageData(0,0,w,h).data, t=+thr.value, ta=+tol.value;
 // Create a compact SVG using a raster-derived alpha mask. White/near-white pixels become transparent.
 // The SVG contains an image with an alpha mask, preserving holes and complex silhouettes.
 const off=document.createElement('canvas');off.width=w;off.height=h;const o=off.getContext('2d');
 const id=o.createImageData(w,h);
 for(let i=0;i<d.length;i+=4){
   const r=d[i],g=d[i+1],b=d[i+2],a=d[i+3];
   const nearWhite=(r>=t-ta&&g>=t-ta&&b>=t-ta);
   id.data[i]=0;id.data[i+1]=0;id.data[i+2]=0;id.data[i+3]=nearWhite?0:a;
 }
 o.putImageData(id,0,0);
 const png=off.toDataURL('image/png');
 svgText=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
<image href="${png}" width="${w}" height="${h}" preserveAspectRatio="none"/>
</svg>`;
 status.textContent='تم إنشاء SVG. نزّله ثم مرّره إلى AutoFramer لتحويله إلى Canva Frame.';
 download.disabled=false;
};
download.onclick=()=>{const blob=new Blob([svgText],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script>
</body></html>
