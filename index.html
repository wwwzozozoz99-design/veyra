<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image → Canva Frame — Potrace Vector</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#161616;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif}
.wrap{max-width:900px;margin:28px auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:24px;box-shadow:0 8px 30px #0000000b}
h1{margin:0 0 8px;font-size:30px}p{color:#666}.drop{margin-top:20px;border:2px dashed #aaa;border-radius:16px;padding:42px;text-align:center;cursor:pointer}
input[type=file]{display:none}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}.control{background:#f1f1f1;border-radius:12px;padding:10px 14px}
input[type=range]{width:145px;vertical-align:middle}button{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:#111;color:#fff}button.secondary{background:#e8e8e8;color:#111}button:disabled{opacity:.45;cursor:not-allowed}
.status{margin-top:12px;color:#666;font-size:14px}.preview{margin-top:18px;display:flex;justify-content:center;align-items:center;min-height:260px;padding:20px;border-radius:14px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0/24px 24px;overflow:auto}
canvas{max-width:100%;max-height:480px}.note{font-size:13px;margin-top:12px;color:#777}
</style>
<!-- Open-source Potrace port: https://github.com/herrstrietzel/potrace-plus -->
<script src="https://cdn.jsdelivr.net/npm/potrace-plus@latest/dist/potrace-plus.min.js"></script>
</head>
<body>
<div class="wrap"><div class="card">
<h1>Image → Canva Frame</h1>
<p>يحاول تحويل الصورة إلى <b>SVG Vector حقيقي</b> باستخدام Potrace، مع الحفاظ على الأشكال المركبة والفراغات الداخلية.</p>
<label class="drop" for="file">اضغط هنا لاختيار صورة<br><small>PNG / JPG / WebP</small></label>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp">
<div class="row">
<label class="control">Threshold <input id="thr" type="range" min="20" max="245" value="180"></label>
<label class="control">Smoothing <input id="smooth" type="range" min="0" max="2" value="0"></label>
<button id="convert" disabled>تحويل إلى SVG Vector</button>
<button id="download" class="secondary" disabled>تنزيل SVG</button>
</div>
<div class="status" id="status">ماكو ملف مختار.</div>
<div class="preview"><canvas id="preview"></canvas></div>
<div class="note">الأفضل: شكل غامق على خلفية بيضاء/شفافة. Threshold الأعلى يزيل الخلفيات الفاتحة أكثر.</div>
</div></div>

<script>
const file=document.getElementById('file'), convert=document.getElementById('convert'), download=document.getElementById('download');
const preview=document.getElementById('preview'), pctx=preview.getContext('2d',{willReadFrequently:true});
const status=document.getElementById('status'), thr=document.getElementById('thr'), smooth=document.getElementById('smooth');
let image=null, svgText='', filename='canva-frame.svg';

file.onchange=()=>{
  const f=file.files[0]; if(!f)return;
  filename=f.name.replace(/\.[^.]+$/,'')+'-frame.svg';
  const u=URL.createObjectURL(f); image=new Image();
  image.onload=()=>{
    const scale=Math.min(1400/Math.max(image.width,image.height),1);
    preview.width=Math.max(1,Math.round(image.width*scale));
    preview.height=Math.max(1,Math.round(image.height*scale));
    pctx.clearRect(0,0,preview.width,preview.height);
    pctx.drawImage(image,0,0,preview.width,preview.height);
    convert.disabled=false;
    status.textContent=`تم تحميل ${f.name} — ${preview.width}×${preview.height}`;
    URL.revokeObjectURL(u);
  };
  image.src=u;
};

function makeBinaryCanvas(){
  const w=preview.width,h=preview.height;
  const src=pctx.getImageData(0,0,w,h).data;
  const out=document.createElement('canvas');out.width=w;out.height=h;
  const c=out.getContext('2d');const id=c.createImageData(w,h);
  const T=+thr.value;
  for(let i=0;i<src.length;i+=4){
    const r=src[i],g=src[i+1],b=src[i+2],a=src[i+3];
    const lum=0.2126*r+0.7152*g+0.0722*b;
    // Potrace traces dark pixels. Transparent pixels become white.
    const black=(a>8 && lum<T);
    id.data[i]=black?0:255;
    id.data[i+1]=black?0:255;
    id.data[i+2]=black?0:255;
    id.data[i+3]=255;
  }
  c.putImageData(id,0,0);
  return out;
}

convert.onclick=async()=>{
  if(!image)return;
  if(typeof PotracePlus!=='function'){
    status.textContent='تعذر تحميل محرك الـVector. افتح الموقع مع اتصال بالإنترنت ثم أعد المحاولة.';
    return;
  }
  convert.disabled=true;download.disabled=true;status.textContent='جاري استخراج الـVector…';
  try{
    const bin=makeBinaryCanvas();
    const blur=+smooth.value;
    const traced=await PotracePlus(bin,{
      turnpolicy:'majority',
      turdsize:Math.max(1,1+blur),
      optcurve:true,
      alphamax:1,
      opttolerance:1,
      crop:true,
      optimize:true,
      toRelative:false,
      toShorthands:false,
      decimals:3,
      addDimensions:true,
      getPDF:false
    });
    const d=traced.getD();
    if(!d || d.length<10) throw new Error('empty path');
    // Standalone path-only SVG. No embedded raster image.
    const w=traced.width||preview.width, h=traced.height||preview.height;
    svgText=`<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
<path d="${d}" fill="#000000" fill-rule="evenodd"/>
</svg>`;
    download.disabled=false;
    status.textContent=`تم إنشاء SVG Vector حقيقي. عدد أوامر المسار: ${traced.commands||'—'}. نزّله وجربه مع AutoFramer.`;
  }catch(e){
    console.error(e);
    status.textContent='صار خطأ أثناء الـVector. جرّب تغيير Threshold ثم أعد المحاولة.';
  }finally{convert.disabled=false}
};

download.onclick=()=>{
  const blob=new Blob([svgText],{type:'image/svg+xml;charset=utf-8'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
};
</script>
</body></html>
